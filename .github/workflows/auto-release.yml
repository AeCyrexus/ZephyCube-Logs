name: Auto release

on:
  push:
    branches: [main]
    paths:
      - "ZephyCubeLogs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: v
        run: |
          VERSION=$(jq -r '.header.version | map(tostring) | join(".")' ZephyCubeLogs/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.v.outputs.exists == 'false'
        run: |
          NAME="ZephyCubeLogs-v${{ steps.v.outputs.version }}"
          zip -r "$NAME.zip" ZephyCubeLogs README.md logo.png
          (cd ZephyCubeLogs && zip -r "../$NAME.mcpack" .)

      - name: Create release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          gh release create "$V" ZephyCubeLogs-"$V".zip ZephyCubeLogs-"$V".mcpack \
            --target "$GITHUB_SHA" --title "ZephyCubeLogs $V" --generate-notes
